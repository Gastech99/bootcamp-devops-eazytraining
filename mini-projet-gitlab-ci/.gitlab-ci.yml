# =====================================================================
# Pipeline CI/CD - Application Flask "Hello World"
# =====================================================================
# Variables CI/CD à définir dans GitLab > Settings > CI/CD > Variables
# (toutes en "Protected" si possible, et "Masked" pour les secrets) :
#
#   SSH_PRIVATE_KEY        : clé SSH privée (format PEM) pour se connecter
#                             aux serveurs review / staging / production
#   REVIEW_SERVER_USER     / REVIEW_SERVER_HOST
#   STAGING_SERVER_USER    / STAGING_SERVER_HOST
#   PROD_SERVER_USER       / PROD_SERVER_HOST
#   SONAR_TOKEN             : token du projet SonarCloud
#   SONAR_HOST_URL          : https://sonarcloud.io
#   SONAR_ORGANIZATION      : ton organisation SonarCloud
#   SONAR_PROJECT_KEY       : la clé du projet SonarCloud
#
# Registre d'images : le GitLab Container Registry du projet est utilisé
# (CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_REGISTRY_IMAGE
#  sont des variables prédéfinies par GitLab, rien à configurer).
#
# Structure de repo attendue :
#   ./Dockerfile
#   ./webapp/app.py
#   ./webapp/wsgi.py
#   ./webapp/requirements.txt
#   ./webapp/test_app.py
# =====================================================================

stages:
  - lint
  - build
  - scan
  - test
  - quality
  - package
  - review
  - staging
  - production
  - validate

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG_SHA: "$CI_COMMIT_SHORT_SHA"
  APP_PORT: "5000"

# ---------------------------------------------------------------------
# Blocs de règles réutilisables (Gitflow)
# ---------------------------------------------------------------------
# Exécuté partout : MR, main, autres branches
.rules_everywhere: &rules_everywhere
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'

# Exécuté uniquement en MR ou sur main (packaging)
.rules_mr_or_main: &rules_mr_or_main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Exécuté uniquement en MR (review)
.rules_mr_only: &rules_mr_only
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Exécuté uniquement sur main (staging / prod)
.rules_main_only: &rules_main_only
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# =====================================================================
# LINTER
# =====================================================================
flake8:
  stage: lint
  image: python:3.11-alpine
  <<: *rules_everywhere
  before_script:
    - pip install --no-cache-dir flake8
  script:
    - flake8 webapp --ignore=E501,E303

hadolint:
  stage: lint
  image: hadolint/hadolint:latest-debian
  <<: *rules_everywhere
  script:
    - hadolint Dockerfile

# =====================================================================
# COMPILATION (artefact = image Docker poussée sur le registre)
# =====================================================================
build:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  <<: *rules_everywhere
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG_SHA" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG_SHA"

# =====================================================================
# SCAN DE SECURITE - Trivy
# =====================================================================
trivy_scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  <<: *rules_everywhere
  script:
    - trivy image --exit-code 0 --severity LOW,MEDIUM --ignorefile .trivyignore --no-progress "$IMAGE_NAME:$IMAGE_TAG_SHA"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore --no-progress "$IMAGE_NAME:$IMAGE_TAG_SHA"
# =====================================================================
# TESTS AUTOMATISES
# =====================================================================
unit_tests:
  stage: test
  image: python:3.11-alpine
  <<: *rules_everywhere
  before_script:
    - pip install --no-cache-dir -r webapp/requirements.txt
  script:
    - cd webapp
    - python -m unittest discover -v

# =====================================================================
# QUALITE DE CODE - SonarCloud
# =====================================================================
sonarcloud:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  <<: *rules_everywhere
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache"
    paths:
      - .sonar/cache
  script:
    - echo "ORG=[$SONAR_ORGANIZATION] KEY=[$SONAR_PROJECT_KEY] TOKEN_LEN=${#SONAR_TOKEN}"
    - >
      sonar-scanner
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.sources=webapp
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  <<: *rules_everywhere
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache"
    paths:
      - .sonar/cache
  script:
    - echo "ORG=[$SONAR_ORGANIZATION] KEY=[$SONAR_PROJECT_KEY] TOKEN_LEN=${#SONAR_TOKEN}"
    - >
      sonar-scanner
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.sources=webapp
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"

  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  <<: *rules_everywhere
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache"
    paths:
      - .sonar/cache
  script:
    - >
      sonar-scanner
      -Dsonar.organization="$SONAR_ORGANIZATION"
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.sources=webapp
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"

# =====================================================================
# PACKAGING (sauvegarde dans le registre GitLab)
# Exécuté uniquement sur MR et sur main
# =====================================================================
package:
  stage: package
  image: docker:24-cli
  services:
    - docker:24-dind
  <<: *rules_mr_or_main
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$IMAGE_NAME:$IMAGE_TAG_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE_NAME:$IMAGE_TAG_SHA" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      else
        docker tag "$IMAGE_NAME:$IMAGE_TAG_SHA" "$IMAGE_NAME:mr-$CI_MERGE_REQUEST_IID"
        docker push "$IMAGE_NAME:mr-$CI_MERGE_REQUEST_IID"
      fi

# =====================================================================
# DEPLOIEMENT DYNAMIQUE EN REVIEW (uniquement sur Pull/Merge Request)
# =====================================================================
deploy_review:
  stage: review
  image: alpine:latest
  <<: *rules_mr_only
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: http://$REVIEW_SERVER_HOST:$APP_PORT
    on_stop: stop_review
    auto_stop_in: 1 week
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$REVIEW_SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$REVIEW_SERVER_USER@$REVIEW_SERVER_HOST" "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $IMAGE_NAME:mr-$CI_MERGE_REQUEST_IID &&
        docker rm -f review-$CI_COMMIT_REF_SLUG || true &&
        docker run -d --name review-$CI_COMMIT_REF_SLUG -p $APP_PORT:5000 $IMAGE_NAME:mr-$CI_MERGE_REQUEST_IID
      "

stop_review:
  stage: review
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$REVIEW_SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$REVIEW_SERVER_USER@$REVIEW_SERVER_HOST" "docker rm -f review-$CI_COMMIT_REF_SLUG || true"
  allow_failure: true

# =====================================================================
# STAGING (uniquement sur main)
# =====================================================================
deploy_staging:
  stage: staging
  image: alpine:latest
  <<: *rules_main_only
  environment:
    name: staging
    url: http://$STAGING_SERVER_HOST:$APP_PORT
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-keygen -y -f /dev/stdin 2>&1 | head -1
    - echo "$SSH_PRIVATE_KEY" | head -1
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$STAGING_SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$STAGING_SERVER_USER@$STAGING_SERVER_HOST" "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $IMAGE_NAME:latest &&
        docker rm -f app-staging || true &&
        docker run -d --name app-staging -p $APP_PORT:5000 $IMAGE_NAME:latest
      "

# =====================================================================
# PRODUCTION (uniquement sur main, déclenchement manuel)
# =====================================================================
deploy_production:
  stage: production
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  environment:
    name: production
    url: http://$PROD_SERVER_HOST:$APP_PORT
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$PROD_SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$PROD_SERVER_USER@$PROD_SERVER_HOST" "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $IMAGE_NAME:latest &&
        docker rm -f app-production || true &&
        docker run -d --name app-production -p $APP_PORT:5000 $IMAGE_NAME:latest
      "

# =====================================================================
# TESTS DE VALIDATION DES DEPLOIEMENTS (uniquement sur main)
# =====================================================================
validate_staging:
  stage: validate
  image: alpine:latest
  <<: *rules_main_only
  needs:
    - deploy_staging
  before_script:
    - apk add --no-cache curl
  script:
    - sleep 5
    # Teste que l'application est bien déployée sur le serveur de staging
    - curl -sf --max-time 10 "http://$STAGING_SERVER_HOST:$APP_PORT" | grep -q "Hello world!"


validate_production:
  stage: validate
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - deploy_production
  before_script:
    - apk add --no-cache curl
  script:
    - sleep 5
    - curl -sf --max-time 10 "http://$PROD_SERVER_HOST:$APP_PORT" | grep -q "Hello world!"